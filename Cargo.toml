[workspace]
resolver = "2"
members = [
    "crates/caf-core",
    "crates/caf-cli",
    "crates/caf-app",
    "crates/caf-xtask",
    "crates/caf-migrator",
]

[workspace.package]
version = "1.0.9"
edition = "2024"
rust-version = "1.98"
authors = ["Cecep Saeful Azhar Hidayat, ST <hi@cecepazhar.com>"]
license = "MIT"
repository = "https://github.com/cecepazhar/camark"

[workspace.dependencies]
cargo-tarpaulin = "0.28"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
directories = "5"
sysinfo = "0.32"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true

[profile.dev]
panic = "unwind"
